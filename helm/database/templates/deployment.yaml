apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taxi-data-processor.fullname" . }}
  labels:
    {{- include "taxi-data-processor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taxi-data-processor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "taxi-data-processor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taxi-data-processor.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: TAXIS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taxi-data-processor.fullname" . }}-secrets
                  key: database-password
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /config/application.yml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: input-data
              mountPath: {{ .Values.config.processing.inputDirectory }}
            - name: output-data
              mountPath: {{ .Values.config.processing.outputDirectory }}
            - name: error-data
              mountPath: {{ .Values.config.processing.errorDirectory }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "taxi-data-processor.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: input-data
          {{- if .Values.persistence.storageClass }}
          persistentVolumeClaim:
            claimName: {{ include "taxi-data-processor.fullname" . }}-input
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: output-data
          {{- if .Values.persistence.storageClass }}
          persistentVolumeClaim:
            claimName: {{ include "taxi-data-processor.fullname" . }}-output
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: error-data
          {{- if .Values.persistence.storageClass }}
          persistentVolumeClaim:
            claimName: {{ include "taxi-data-processor.fullname" . }}-error
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

